{% extends "layout.html" %}
{% block content %}
<div class="container py-4" style="max-width:800px"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1>Editar evento</h1><p class="text-muted mb-0">Actualice la tarea o recordatorio de la agenda.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('rrhh_agenda', year=evento.inicio.year, month=evento.inicio.month) }}">Volver al calendario</a></div>
{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="alert alert-{{ 'danger' if category == 'error' else category }}">{{ message }}</div>{% endfor %}{% endwith %}
<form method="post" class="card border-0 shadow-sm p-4 row g-3"><div class="col-md-8"><label class="form-label">Título</label><input class="form-control" name="titulo" value="{{ evento.titulo }}" required></div><div class="col-md-4"><label class="form-label">Tipo</label><select class="form-select" name="tipo">{% for tipo in ['Tarea','Reunion','Recordatorio','Aviso','Capacitacion','Otro'] %}<option {{ 'selected' if evento.tipo == tipo else '' }}>{{ tipo }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Inicio</label><input class="form-control" type="datetime-local" name="inicio" value="{{ evento.inicio.strftime('%Y-%m-%dT%H:%M') }}" required></div><div class="col-md-6"><label class="form-label">Fin</label><input class="form-control" type="datetime-local" name="fin" value="{{ evento.fin.strftime('%Y-%m-%dT%H:%M') if evento.fin else '' }}"></div><div class="col-md-6"><label class="form-label">Estado</label><select class="form-select" name="estado">{% for estado in ['Pendiente','En curso','Completado','Cancelado'] %}<option {{ 'selected' if evento.estado == estado else '' }}>{{ estado }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Lugar</label><input class="form-control" name="lugar" value="{{ evento.lugar }}"></div><div class="col-md-6"><label class="form-label">Colaborador</label><select class="form-select" name="colaborador_id"><option value="">Sin asignar</option>{% for colaborador in colaboradores %}<option value="{{ colaborador.id }}" {{ 'selected' if evento.colaborador_id == colaborador.id else '' }}>{{ colaborador.nombre }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label">Responsable</label><select class="form-select" name="responsable_usuario_id"><option value="">Sin responsable</option>{% for supervisor in supervisores %}<option value="{{ supervisor.id }}" {{ 'selected' if evento.responsable_usuario_id == supervisor.id else '' }}>{{ supervisor.full_name }}</option>{% endfor %}</select></div><div class="col-12"><label class="form-label">Notas</label><textarea class="form-control" name="notas" rows="4">{{ evento.notas }}</textarea></div><div class="col-12"><label class="form-label">Responsable externo</label><input class="form-control" name="responsable" value="{{ evento.responsable }}"></div><div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" name="notificar" value="SI" id="notificar" {{ 'checked' if evento.notificar else '' }}><label class="form-check-label" for="notificar">Notificar al responsable</label></div><div class="col-12"><button class="btn btn-primary" type="submit">Guardar cambios</button></div></form></div>
{% endblock %}
