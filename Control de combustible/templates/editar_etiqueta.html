{% extends "layout.html" %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center flex-wrap gap-3 mb-4"><div><div class="small text-uppercase text-primary fw-semibold">Calidad · ETQ-{{ '%07d'|format(etiqueta.id) }}</div><h1 class="mb-1">Editar etiqueta</h1><p class="text-muted mb-0">Actualice los datos y vuelva a generar el PDF.</p></div><a class="btn btn-outline-secondary" href="{{ url_for('consultar_etiquetas_qality') }}"><i class="bi bi-arrow-left me-2"></i>Volver a consultar</a></div>
  <form method="post" class="row g-3" id="edit-quality-form">
    <div class="col-md-6"><label class="form-label" for="tipo_producto">Tipo de producto</label><select class="form-select" id="tipo_producto" name="tipo_producto" required><option value="Palanquillas" {{ 'selected' if etiqueta.tipo_producto == 'Palanquillas' }}>Palanquillas</option><option value="AP500S" {{ 'selected' if etiqueta.tipo_producto == 'AP500S' }}>AP500 S</option><option value="VarillasLisas" {{ 'selected' if etiqueta.tipo_producto == 'VarillasLisas' }}>Varillas Lisas</option></select></div>
    <div class="col-md-6"><label class="form-label" for="calidad">Calidad</label><select class="form-select" id="calidad" name="calidad" required><option value="">Seleccione</option><option value="AP500S" {{ 'selected' if etiqueta.calidad == 'AP500S' }}>AP500 S</option><option value="A36" {{ 'selected' if etiqueta.calidad == 'A36' }}>A36 · Varillas Lisas</option><option value="Inoxidable" {{ 'selected' if etiqueta.calidad == 'Inoxidable' }}>Inoxidable</option></select></div>
    <div class="col-md-6"><label class="form-label" for="colada">Número de colada</label><input class="form-control" id="colada" name="colada" value="{{ etiqueta.colada or '' }}" required></div>
    <div class="col-md-3 rod-field"><label class="form-label" for="medida">Medida (mm)</label><select class="form-select" id="medida" name="medida"><option value="">Seleccione</option>{% for value in ['8','10','12','16','20','25'] %}<option value="{{ value }}" {{ 'selected' if etiqueta.medida == value }}>{{ value }}</option>{% endfor %}</select></div>
    <div class="col-md-3 pal-field"><label class="form-label" for="lote">Lote</label><input class="form-control" id="lote" name="lote" value="{{ etiqueta.lote or '' }}"></div>
    <div class="col-md-3 pal-field"><label class="form-label" for="cantidad">Cantidad</label><input class="form-control" id="cantidad" name="cantidad" type="number" min="0" step="1" value="{{ etiqueta.cantidad if etiqueta.cantidad is not none else '' }}"></div>
    <div class="col-md-3 pal-field"><label class="form-label" for="fecha">Fecha</label><input class="form-control" id="fecha" name="fecha" type="date" value="{{ etiqueta.fecha.isoformat() if etiqueta.fecha else '' }}"></div>
    <div class="col-md-3"><label class="form-label" for="longitud">Longitud</label><input class="form-control" id="longitud" name="longitud" type="number" min="0" step="0.001" value="{{ etiqueta.longitud or '' }}" required></div>
    <div class="col-md-3"><label class="form-label" for="peso">Peso (kg)</label><input class="form-control" id="peso" name="peso" type="number" min="0" step="0.001" value="{{ etiqueta.peso or '' }}" required></div>
    <div class="col-md-4 pal-field"><label class="form-label" for="carbono">Carbono %</label><input class="form-control" id="carbono" name="carbono" value="{{ etiqueta.carbono or '' }}"></div>
    <div class="col-md-4 pal-field"><label class="form-label" for="silicio">Silicio %</label><input class="form-control" id="silicio" name="silicio" value="{{ etiqueta.silicio or '' }}"></div>
    <div class="col-md-4 pal-field"><label class="form-label" for="manganeso">Manganeso %</label><input class="form-control" id="manganeso" name="manganeso" value="{{ etiqueta.manganeso or '' }}"></div>
    <div class="col-md-4 responsable-field pal-field"><label class="form-label" for="hornero">Operador de Horno</label><select class="form-select" id="hornero" name="hornero"><option value="">Seleccione</option>{% for responsable in responsables if responsable.tipo == 'Operador de Horno' %}<option value="{{ responsable.nombre }}" {{ 'selected' if etiqueta.hornero == responsable.nombre }}>{{ responsable.nombre }}</option>{% endfor %}</select></div>
    <div class="col-md-4 responsable-field pal-field"><label class="form-label" for="supervisor">Supervisor</label><select class="form-select" id="supervisor" name="supervisor"><option value="">Seleccione</option>{% for responsable in responsables if responsable.tipo == 'Supervisor' %}<option value="{{ responsable.nombre }}" {{ 'selected' if etiqueta.supervisor == responsable.nombre }}>{{ responsable.nombre }}</option>{% endfor %}</select></div>
    <div class="col-md-4 responsable-field pal-field"><label class="form-label" for="operador_ccm">Operador de CCM</label><select class="form-select" id="operador_ccm" name="operador_ccm"><option value="">Seleccione</option>{% for responsable in responsables if responsable.tipo == 'Operador de CCM' %}<option value="{{ responsable.nombre }}" {{ 'selected' if etiqueta.operador_ccm == responsable.nombre }}>{{ responsable.nombre }}</option>{% endfor %}</select></div>
    <div class="col-12 pal-field"><div class="form-check"><input class="form-check-input" id="aprobado" name="aprobado" type="checkbox" {{ 'checked' if etiqueta.aprobado }}><label class="form-check-label" for="aprobado">Aprobada</label></div></div>
    <div class="col-12 rod-field"><div class="d-flex gap-4"><div class="form-check"><input class="form-check-input status-check" id="tipo_b" name="tipo_b" type="checkbox" {{ 'checked' if etiqueta.tipo_b }}><label class="form-check-label" for="tipo_b">Tipo B</label></div><div class="form-check"><input class="form-check-input status-check" id="no_conforme" name="no_conforme" type="checkbox" {{ 'checked' if etiqueta.no_conforme }}><label class="form-check-label" for="no_conforme">No conforme</label></div></div><div class="form-text">Sin marcar, queda Conforme.</div></div>
    <div class="col-12"><label class="form-label" for="observaciones">Observaciones</label><textarea class="form-control" id="observaciones" name="observaciones" rows="3">{{ etiqueta.observaciones or '' }}</textarea></div>
    <div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit"><i class="bi bi-save me-2"></i>Guardar cambios</button><a class="btn btn-outline-secondary" href="{{ url_for('consultar_etiquetas_qality') }}">Cancelar</a></div>
  </form>
</div>
<script>
  const type = document.getElementById('tipo_producto');
  function toggleFields() { const pal = type.value === 'Palanquillas'; document.querySelectorAll('.pal-field').forEach((field) => { field.hidden = !pal; field.querySelectorAll('input, select').forEach((input) => input.disabled = !pal); }); document.querySelectorAll('.rod-field').forEach((field) => { field.hidden = pal; field.querySelectorAll('input, select').forEach((input) => input.disabled = pal); }); document.querySelectorAll('.responsable-field').forEach((field) => { const shouldShow = pal; field.hidden = !shouldShow; field.querySelectorAll('select').forEach((input) => input.disabled = !shouldShow); }); }
  document.querySelectorAll('.status-check').forEach((check) => check.addEventListener('change', () => { if (check.checked) document.querySelectorAll('.status-check').forEach((other) => { if (other !== check) other.checked = false; }); }));
  type.addEventListener('change', toggleFields); toggleFields();
</script>
{% endblock %}
