{% extends "layout.html" %}
{% block content %}
<style>
  .dispatch-video { min-height: 220px; object-fit: cover; }
  .dispatch-card { min-width: 0; }
  .dispatch-table th, .dispatch-table td { white-space: nowrap; }
  @media (max-width: 575.98px) {
    .dispatch-video { min-height: 180px; }
    .dispatch-table { font-size: .78rem; }
    .dispatch-table th, .dispatch-table td { padding: .45rem .35rem; }
    .dispatch-table th:nth-child(3), .dispatch-table td:nth-child(3) { display: none; }
  }
</style>
<div class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3"><h1 class="mb-0">Carga de camión</h1><a class="btn btn-outline-secondary btn-sm" href="{{ url_for('historial_despacho_acero') }}"><i class="bi bi-clock-history me-1"></i>Historial</a></div>
  <div class="row g-4">
    <div class="col-lg-6"><div class="card p-3 dispatch-card"><h2 class="h5">Escáner QR</h2><video id="qrVideo" class="w-100 dispatch-video" style="max-height:300px;background:#111" muted playsinline></video><div class="d-flex flex-wrap gap-2 mt-2"><button class="btn btn-primary" type="button" id="startScanner">Iniciar cámara</button><label class="btn btn-outline-primary mb-0">Fotografiar QR<input id="qrImage" type="file" accept="image/*" capture="environment" hidden></label><button class="btn btn-outline-primary" type="button" id="numberEntryToggle"><i class="bi bi-keyboard me-1"></i>Cargar con número de etiquetas</button></div><div id="numberEntry" class="mt-2" hidden><label class="form-label mb-1" for="manualCode">Número de etiqueta</label><div class="d-flex gap-2"><input class="form-control" id="manualCode" placeholder="Ej. 418" inputmode="numeric"><button class="btn btn-outline-primary" type="button" id="addManual">Agregar</button></div></div><div id="status" class="small text-muted mt-2"></div></div></div>
    <div class="col-lg-6"><div class="card p-3 dispatch-card"><h2 class="h5">Carrito de atados</h2><div class="table-responsive mb-2"><table class="table table-sm table-hover align-middle mb-0 dispatch-table" id="cartTable"><thead><tr><th>Código</th><th>Producto</th><th>Medida</th><th>Colada</th><th class="text-end">Peso</th><th class="text-end">Acción</th></tr></thead><tbody id="cart"><tr><td colspan="6" class="text-center text-muted py-3">Sin atados agregados.</td></tr></tbody></table></div><div class="alert alert-info py-2">Peso aproximado cargado: <strong><span id="cartWeight">0.00</span> kg</strong></div><form id="dispatchForm"><select class="form-select mb-2" id="clienteSelect" name="cliente" required><option value="">Seleccione cliente</option>{% for cliente in clientes %}<option value="{{ cliente.nombre }}" data-id="CLI-{{ cliente.id }}" data-destino="{{ cliente.ultimo_destino or '' }}">{{ cliente.nombre }}</option>{% endfor %}</select><input type="hidden" name="cliente_codigo" id="clienteCodigo"><input class="form-control mb-2" id="destino" name="destino" placeholder="Destino" required><input class="form-control mb-2" name="chofer" placeholder="Chofer" required><input class="form-control mb-2" name="cedula" placeholder="Cédula" required><input class="form-control mb-2" name="chapa" placeholder="Chapa" required><button class="btn btn-success w-100" type="submit">Cerrar carga</button></form></div></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const cart = new Map(), statusBox = document.getElementById('status');
let lastScannedCode = '', lastScannedAt = 0, candidateCode = '', candidateHits = 0, candidateStartedAt = 0, activeStream = null, scanning = false, scanBusy = false;
function renderCart(){const box=document.getElementById('cart'); const weight=[...cart.values()].reduce((sum,x)=>sum+(Number.parseFloat(String(x.peso||'0').replace(',','.'))||0),0); document.getElementById('cartWeight').textContent=weight.toFixed(2); if(!cart.size){box.innerHTML='<tr><td colspan="6" class="text-center text-muted py-3">Sin atados agregados.</td></tr>';return;} box.innerHTML=[...cart.values()].map(x=>`<tr><td class="fw-semibold text-nowrap">${x.codigo}</td><td>${x.tipo_nombre}${x.no_informatizado?'<br><span class="badge text-bg-warning">No computada</span>':''}</td><td class="text-nowrap">${x.medida||'-'} mm</td><td>${x.colada||'-'}</td><td class="text-end text-nowrap">${x.peso||'-'} kg</td><td class="text-end"><button type="button" class="btn btn-sm btn-outline-danger" data-id="${x.id}">Quitar</button></td></tr>`).join(''); box.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{cart.delete(Number(b.dataset.id));renderCart();});}
function normalizeLabelNumber(code){const value=String(code||'').trim();return /^\d{1,12}$/.test(value)?`ETQ-${value}`:value;}
function isCompleteQr(code){const value=String(code||'').trim();return /^\d{1,12}$/.test(value)||/^ETQ[-\s:]?\d{1,12}$/i.test(value)||(/^NO-INF[-\s:]?\d{1,12}$/i.test(value))||(value.length > 80&&/tipo\s+de\s+producto/i.test(value)&&/(numero\s+de\s+colada|colada)/i.test(value));}
async function addCode(code){code=normalizeLabelNumber(code);if(!code||!isCompleteQr(code)){statusBox.textContent='Ingrese un número de etiqueta válido o mantenga el QR completo enfocado.';return false;} try{const r=await fetch('/admin/despacho/etiqueta/'+encodeURIComponent(code));const d=await r.json();if(!r.ok||!d.ok){statusBox.textContent=d.message||'No se pudo agregar la etiqueta.';return false;}cart.set(d.etiqueta.id,d.etiqueta);renderCart();document.getElementById('cartTable').scrollIntoView({behavior:'smooth',block:'nearest'});statusBox.textContent=`Etiqueta agregada al carrito (${cart.size} atado${cart.size === 1 ? '' : 's'}).`;return true;}catch(error){statusBox.textContent='No se pudo confirmar la etiqueta. La cámara continúa activa.';return false;}}
document.getElementById('addManual').onclick=()=>addCode(document.getElementById('manualCode').value.trim());
document.getElementById('numberEntryToggle').onclick=()=>{const entry=document.getElementById('numberEntry');entry.hidden=!entry.hidden;if(!entry.hidden)document.getElementById('manualCode').focus();};
document.getElementById('clienteSelect').onchange=e=>{const option=e.target.selectedOptions[0];document.getElementById('clienteCodigo').value=option.dataset.id||'';document.getElementById('destino').value=option.dataset.destino||'';};
document.getElementById('dispatchForm').onsubmit=async e=>{e.preventDefault(); if(!cart.size){statusBox.textContent='Agregue al menos un atado.';return;} const data=Object.fromEntries(new FormData(e.target)); data.etiqueta_ids=[...cart.keys()]; data.cliente_confirmado=true; const r=await fetch('/admin/despacho/guardar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}); const d=await r.json(); statusBox.textContent=d.message|| (r.ok?'Despacho guardado.':'No se pudo guardar.'); if(r.ok){cart.clear();renderCart();e.target.reset();}};
const qrDetector='BarcodeDetector' in window?new BarcodeDetector({formats:['qr_code']}):null, qrCanvas=document.createElement('canvas'), qrContext=qrCanvas.getContext('2d',{willReadFrequently:true});
async function detectQr(source,width,height){if(qrDetector){try{const codes=await qrDetector.detect(source);if(codes[0]?.rawValue)return codes[0].rawValue;}catch(error){}} if(!window.jsQR)return null;const sourceWidth=width||source.videoWidth||source.width, sourceHeight=height||source.videoHeight||source.height;if(!sourceWidth||!sourceHeight)return null;const scale=Math.min(1,800/sourceWidth);const scanWidth=Math.max(1,Math.round(sourceWidth*scale)),scanHeight=Math.max(1,Math.round(sourceHeight*scale));if(qrCanvas.width!==scanWidth||qrCanvas.height!==scanHeight){qrCanvas.width=scanWidth;qrCanvas.height=scanHeight;}qrContext.drawImage(source,0,0,scanWidth,scanHeight);return window.jsQR(qrContext.getImageData(0,0,scanWidth,scanHeight).data,scanWidth,scanHeight,{inversionAttempts:'dontInvert'})?.data||null;}
async function scanImage(file){if(!file){return;} const image=await createImageBitmap(file); const code=await detectQr(image,image.width,image.height); if(code) await addCode(code); else statusBox.textContent='No se encontró un QR en la foto. Acerque y enfoque la etiqueta.';}
document.getElementById('qrImage').onchange=e=>scanImage(e.target.files[0]);
document.getElementById('startScanner').onclick=async()=>{try{if(scanning)return;const secureContext=window.isSecureContext||['localhost','127.0.0.1'].includes(window.location.hostname);if(!secureContext){const secureUrl=window.location.href.replace(/^http:/,'https:');statusBox.innerHTML=`Abra este módulo con HTTPS: <a href="${secureUrl}">${secureUrl}</a>`;return;}if(!navigator.mediaDevices?.getUserMedia){statusBox.textContent='Este navegador no permite acceder a la cámara. Use Fotografiar QR.';return;}const video=document.getElementById('qrVideo');activeStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:960},height:{ideal:540}}});video.srcObject=activeStream;await video.play();scanning=true;statusBox.textContent='Cámara activa. Mantenga el QR completo enfocado.';const scan=async()=>{if(!scanning)return;if(!scanBusy){scanBusy=true;try{const code=await detectQr(video,video.videoWidth,video.videoHeight);const now=Date.now();if(code&&isCompleteQr(code)){if(code===candidateCode&&now-candidateStartedAt<1400){candidateHits+=1;}else{candidateCode=code;candidateHits=1;candidateStartedAt=now;}if(candidateHits>=2&&!(code===lastScannedCode&&now-lastScannedAt<2500)){lastScannedCode=code;lastScannedAt=now;candidateCode='';candidateHits=0;await addCode(code);}}else if(!code){candidateCode='';candidateHits=0;}}catch(error){statusBox.textContent='Enfoque el QR completo dentro de la imagen.';}finally{scanBusy=false;}}if(scanning)setTimeout(scan,220);};scan();video.addEventListener('pause',()=>{if(scanning)video.play().catch(()=>{});});}catch(error){scanning=false;if(activeStream)activeStream.getTracks().forEach(track=>track.stop());activeStream=null;statusBox.textContent='Cámara bloqueada en este dispositivo. Revise el permiso de cámara y use HTTPS.';}};
window.addEventListener('beforeunload',()=>{if(activeStream)activeStream.getTracks().forEach(track=>track.stop());});
</script>
{% endblock %}
