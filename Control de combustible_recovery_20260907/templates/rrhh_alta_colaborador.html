{% extends "layout.html" %}
{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4"><div><h1>Colaboradores</h1><p class="text-muted mb-0">Alta y gestión del padrón de Recursos Humanos.</p></div><a class="btn btn-outline-primary" href="/rrhh/colaboradores/padron">Ver padrón</a></div>
  <form method="post" enctype="multipart/form-data" class="row g-3">
    <div class="col-md-4"><label class="form-label">Legajo</label><input class="form-control" name="legajo" required></div>
    <div class="col-md-8"><label class="form-label">Nombre completo</label><input class="form-control" name="nombre" required></div>
    <div class="col-md-4"><label class="form-label">Documento</label><input class="form-control" name="documento"></div>
    <div class="col-md-4"><label class="form-label">Área</label><input class="form-control" name="area"></div>
    <div class="col-md-4"><label class="form-label">Cargo</label><input class="form-control" name="cargo"></div>
    <div class="col-md-4"><label class="form-label">Puesto</label><input class="form-control" name="puesto"></div>
    <div class="col-md-4"><label class="form-label">Fecha de ingreso</label><input class="form-control" type="date" name="fecha_ingreso" required></div>
    <div class="col-md-4"><label class="form-label">Fecha de nacimiento</label><input class="form-control" type="date" name="fecha_nacimiento"></div>
    <div class="col-md-4"><label class="form-label">Teléfono</label><input class="form-control" name="telefono"></div>
    <div class="col-md-4"><label class="form-label">Correo</label><input class="form-control" type="email" name="correo"></div>
    <div class="col-md-4"><label class="form-label">Turno</label><input class="form-control" name="turno_linea"></div>
    <div class="col-md-4"><label class="form-label">Foto</label><input class="form-control" type="file" name="foto" accept="image/*"></div>
    <div class="col-12"><button class="btn btn-primary" type="submit">Guardar colaborador</button></div>
  </form>
</div>
{% endblock %}
